name: Merge

on:
  pull_request:
    paths: ['packages/**/*.toml']

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check and merge
        run: |
          FILE=$(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | grep 'packages/.*\.toml' | head -1)
          [ -z "$FILE" ] && exit 0
          
          GIT_URL=$(grep '^git = ' "$FILE" | cut -d'"' -f2)
          COMMIT=$(grep '^commit = ' "$FILE" | cut -d'"' -f2)
          
          git clone --depth 1 "$GIT_URL" --branch "$COMMIT" /tmp/pkg || exit 1
          if ! find /tmp/pkg -name "*.cpp" -o -name "*.cc" | grep -q .; then
            echo "No C++ files found"
            exit 1
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          git merge --ff-only ${{ github.head_ref }}
          git push