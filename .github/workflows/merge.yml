name: Merge

on:
  pull_request:
    paths: ['packages/**/*.toml']

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check and merge
        run: |
          git checkout ${{ github.base_ref }}
          git pull origin ${{ github.base_ref }}
          
          git fetch origin ${{ github.head_ref }}
          
          git diff --name-only origin/${{ github.base_ref }} origin/${{ github.head_ref }}
          
          FILE=$(git diff --name-only origin/${{ github.base_ref }} origin/${{ github.head_ref }} | grep '\.toml$' | head -1)
          
          if [ -z "$FILE" ]; then
            echo "No toml file found"
            exit 0
          fi
          
          echo "Found file: $FILE"
          cat "$FILE"
          
          GIT_URL=$(grep '^git = ' "$FILE" | cut -d'"' -f2)
          COMMIT=$(grep '^commit = ' "$FILE" | cut -d'"' -f2)
          
          echo "Git URL: $GIT_URL"
          echo "Commit: $COMMIT"
          
          git clone "$GIT_URL" /tmp/pkg
          cd /tmp/pkg
          git checkout "$COMMIT"
          cd -
          
          if ! find /tmp/pkg -name "*.cpp" -o -name "*.cc" | head -1 | grep -q .; then
            echo "No C++ files found"
            exit 1
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          
          git merge --ff-only origin/${{ github.head_ref }} && git push origin ${{ github.base_ref }}