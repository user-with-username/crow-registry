name: Merge

on:
  pull_request:
    paths: ['packages/**/*.toml']

permissions:
  contents: write
  pull-requests: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect changed TOML file and operation
        id: detect
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          git fetch origin "$BASE" "$HEAD" --quiet

          TOML_FILES=$(git diff --name-only "origin/$BASE" "origin/$HEAD" | grep '\.toml$')
          TOML_COUNT=$(echo "$TOML_FILES" | grep -c '\.toml$' || true)

          if [ "$TOML_COUNT" -eq 0 ]; then
            echo "No .toml files changed — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TOML_COUNT" -gt 1 ]; then
            echo "Error: PR must change exactly one .toml file, found $TOML_COUNT"
            exit 1
          fi

          FILE="$TOML_FILES"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

          PREV=$(git show "origin/$BASE:$FILE" 2>/dev/null || true)
          NEW=$(git show  "origin/$HEAD:$FILE" 2>/dev/null || true)

          if [ -z "$PREV" ] && [ -n "$NEW" ]; then
            echo "operation=create" >> "$GITHUB_OUTPUT"

          elif [ -n "$PREV" ] && [ -z "$NEW" ]; then
            echo "operation=delete" >> "$GITHUB_OUTPUT"

          elif [ -n "$PREV" ] && [ -n "$NEW" ]; then
            PREV_COMMIT=$(echo "$PREV" | grep '^commit = ' | cut -d'"' -f2)
            NEW_COMMIT=$(echo  "$NEW"  | grep '^commit = ' | cut -d'"' -f2)

            if [ "$PREV_COMMIT" = "$NEW_COMMIT" ]; then
              echo "Error: commit hash did not change — nothing to update"
              exit 1
            fi
            echo "operation=update" >> "$GITHUB_OUTPUT"

          else
            echo "Error: cannot determine operation"
            exit 1
          fi

      - name: Resolve original owner via GitHub API
        id: owner
        if: |
          steps.detect.outputs.skip != 'true' &&
          (steps.detect.outputs.operation == 'update' ||
           steps.detect.outputs.operation == 'delete')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ github.base_ref }}"
          REPO="${{ github.repository }}"
          FILE="${{ steps.detect.outputs.file }}"
          API="$GITHUB_API_URL/repos/$REPO"
          ENCODED_FILE=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE")

          PAGE=1
          PER_PAGE=100
          FIRST_SHA=""

          while true; do
            RESPONSE=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --include \
              "$API/commits?sha=$BASE&path=$ENCODED_FILE&per_page=$PER_PAGE&page=$PAGE")

            BODY=$(echo "$RESPONSE" | sed '1,/^\r$/d')
            HEADERS=$(echo "$RESPONSE" | sed '/^\r$/,$d')
            COUNT=$(echo "$BODY" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            FIRST_SHA=$(echo "$BODY" | jq -r '.[-1].sha')

            if echo "$HEADERS" | grep -q 'rel="next"'; then
              PAGE=$((PAGE + 1))
            else
              break
            fi
          done

          if [ -z "$FIRST_SHA" ]; then
            echo "Error: could not find any commit for $FILE on $BASE"
            exit 1
          fi

          echo "first_commit=$FIRST_SHA" >> "$GITHUB_OUTPUT"
          echo "First commit for $FILE: $FIRST_SHA"

          OWNER_LOGIN=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/commits/$FIRST_SHA/pulls" \
            | jq -r '
                [ .[] | select(.base.ref == "'"$BASE"'" and .merged_at != null) ]
                | sort_by(.merged_at)
                | .[0].user.login // empty
              ')

          if [ -z "$OWNER_LOGIN" ]; then
            echo "No merged PR found for $FIRST_SHA, falling back to committer login"

            OWNER_LOGIN=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/commits/$FIRST_SHA" \
              | jq -r '.committer.login // empty')
          fi

          if [ -z "$OWNER_LOGIN" ]; then
            echo "Error: could not resolve owner of $FILE"
            echo "Commit $FIRST_SHA has no associated PR and no resolvable committer."
            exit 1
          fi

          echo "login=$OWNER_LOGIN" >> "$GITHUB_OUTPUT"
          echo "Owner of '$FILE': $OWNER_LOGIN (via commit $FIRST_SHA)"

      - name: Verify PR author is the owner
        if: |
          steps.detect.outputs.skip != 'true' &&
          (steps.detect.outputs.operation == 'update' ||
           steps.detect.outputs.operation == 'delete')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          PR_AUTHOR=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$REPO/pulls/$PR_NUMBER" \
            | jq -r '.user.login')

          OWNER="${{ steps.owner.outputs.login }}"
          FILE="${{ steps.detect.outputs.file }}"
          OP="${{ steps.detect.outputs.operation }}"

          echo "PR author : $PR_AUTHOR"
          echo "File owner: $OWNER"
          echo "Operation : $OP"

          if [ "$PR_AUTHOR" != "$OWNER" ]; then
            echo "Permission denied:"
            echo "  '$PR_AUTHOR' is trying to $OP '$FILE'"
            echo "  but the file was originally published by '$OWNER'."
            echo "  Only the original author may update or delete their package."
            exit 1
          fi

          echo "Author verified: $PR_AUTHOR is the owner of $FILE"

      - name: Validate TOML content
        if: |
          steps.detect.outputs.skip != 'true' &&
          steps.detect.outputs.operation != 'delete'
        run: |
          FILE="${{ steps.detect.outputs.file }}"
          HEAD="${{ github.head_ref }}"

          FILE_CONTENT=$(git show "origin/$HEAD:$FILE")

          GIT_URL=$(echo "$FILE_CONTENT" | grep '^git = '    | cut -d'"' -f2)
          COMMIT=$(echo  "$FILE_CONTENT" | grep '^commit = ' | cut -d'"' -f2)

          if [ -z "$GIT_URL" ]; then
            echo "Error: missing 'git' field in $FILE"
            exit 1
          fi
          if [ -z "$COMMIT" ]; then
            echo "Error: missing 'commit' field in $FILE"
            exit 1
          fi

          echo "git    = $GIT_URL"
          echo "commit = $COMMIT"

          git clone --quiet "$GIT_URL" /tmp/pkg
          cd /tmp/pkg
          if ! git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
            echo "Error: commit $COMMIT not found in $GIT_URL"
            exit 1
          fi
          git checkout --quiet "$COMMIT"

          CPP_COUNT=$(find . -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" | wc -l)
          if [ "$CPP_COUNT" -eq 0 ]; then
            echo "Error: no C++ source files (*.cpp / *.cc / *.cxx) found in $GIT_URL@$COMMIT"
            exit 1
          fi

          echo "Found $CPP_COUNT C++ file(s) — validation passed"

      - name: Merge PR
        if: steps.detect.outputs.skip != 'true'
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          PR="${{ github.event.pull_request.number }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          OP="${{ steps.detect.outputs.operation }}"
          FILE="${{ steps.detect.outputs.file }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout "$BASE"
          git pull origin "$BASE" --quiet

          git fetch origin "$HEAD" --quiet
          git merge --ff-only "origin/$HEAD" \
            -m "chore: $OP $FILE (#$PR) by @$AUTHOR"

          git push origin "$BASE"
          echo "Merged PR #$PR ($OP) by @$AUTHOR"