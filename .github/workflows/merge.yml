name: Merge

on:
  pull_request:
    paths: ['packages/**/*.toml']

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Check and merge
        run: |
          git checkout ${{ github.base_ref }}
          git pull origin ${{ github.base_ref }}
          
          git fetch origin ${{ github.head_ref }}
          FILE=$(git diff --name-only origin/${{ github.base_ref }} origin/${{ github.head_ref }} | grep 'packages/.*\.toml' | head -1)
          [ -z "$FILE" ] && exit 0
          
          GIT_URL=$(grep '^git = ' "$FILE" | cut -d'"' -f2)
          COMMIT=$(grep '^commit = ' "$FILE" | cut -d'"' -f2)
          
          git clone --depth 1 "$GIT_URL" --branch "$COMMIT" /tmp/pkg || exit 1
          if ! find /tmp/pkg -name "*.cpp" -o -name "*.cc" | grep -q .; then
            echo "No C++ files found"
            exit 1
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          
          if git merge --ff-only origin/${{ github.head_ref }}; then
            git push origin ${{ github.base_ref }}
            echo "Successfully merged PR #${{ github.event.pull_request.number }}"
          else
            echo "Fast-forward merge failed"
            exit 1
          fi